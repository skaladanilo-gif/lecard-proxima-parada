<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeCard · Sua próxima parada</title>
<meta name="description" content="Enquanto o ônibus não vem, descubra sua próxima parada. Ativação experimental da campanha LeCard no Ponto UFES, Goiabeiras, Vitória.">
<meta name="theme-color" content="#FFBC00">
<script>
/* Rotas reconhecidas (com ou sem subpasta, com ou sem barra final):
   /, /index.html, /quiz, /quiz/, /quiz.html, /quiz/index.html, /resultado, /resultado/, /resultado.html, /resultado/index.html.
   Para forçar a base do site, defina data-base no <html>. */
(function () {
  var d = document.documentElement, b = d.getAttribute("data-base"), route = "inicio";
  var s = location.pathname.replace(/\/+$/, "").split("/");
  if (/^index(\.html?)?$/i.test(s[s.length - 1] || "")) s.pop();
  var m = /^(quiz|resultado)(\.html?)?$/i.exec(s[s.length - 1] || "");
  if (m) { route = m[1].toLowerCase(); s.pop(); }
  else if (/\.html?$/i.test(s[s.length - 1] || "")) s.pop();
  window.__ROUTE__ = route;
  if (!b) b = s.join("/") + "/";
  b = b.replace(/["<>]/g, "");
  window.__SITE_BASE__ = b;
  document.write('<base href="' + b + '">');
  try { if (sessionStorage.getItem("lecard-smoke") === "1") { sessionStorage.removeItem("lecard-smoke"); d.className += " smoke-enter"; } } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Maven+Pro:wght@500;600;700;800&display=swap">

<script src="app.js?v=20261009b" defer></script>
</head>

        <svg class="card-nfc" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 10a9 9 0 0 1 0 12M13 6.5a14 14 0 0 1 0 19M18 3a19 19 0 0 1 0 26" stroke="#121214" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
